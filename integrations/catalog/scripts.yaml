find_netflix_by_performer:
  alias: Find Netflix movies or specials by performer
  description: Read-only discovery for actor or comedian requests on Netflix in the
    Philippines. Use this before choosing a movie, special, or series by a performer;
    do not guess titles with the playback tool. Checks cast credits and Netflix PH
    subscription links. content_kind=movie excludes likely performer-titled/stand-up
    specials; use special for comedians' stand-up shows. choose_random=true returns
    one selected candidate from the verified pool, but NEVER plays it. Only call a
    playback tool afterward if the user asked to play. Results may be cached and incomplete;
    search_incomplete does not mean no titles are available. Do not invent candidates.
  mode: parallel
  max: 3
  fields:
    performer:
      name: Performer
      description: Canonical full actor or comedian name, not a guessed film title.
      required: true
      selector:
        text: null
    content_kind:
      name: Content kind
      default: movie
      selector:
        select:
          options:
          - movie
          - special
          - series
    choose_random:
      name: Choose a random candidate
      description: Select from the verified pool when the user asks you to pick/play
        one. Does not start playback.
      default: false
      selector:
        boolean: null
  sequence:
  - variables:
      discovery_payload:
        performer: '{{ performer }}'
        content_kind: '{{ content_kind | default("movie") }}'
        choose_random: '{{ choose_random | default(false) }}'
  - action: shell_command.nova_catalog_discovery
    data:
      request_payload: '{{ discovery_payload }}'
    response_variable: discovery_output
  - variables:
      discovery_result: '{{ discovery_output.get("stdout", "") | from_json({}) }}'
  - if: '{{ discovery_output.get("returncode", 1) != 0 or discovery_result is not
      mapping or "status" not in discovery_result }}'
    then:
    - variables:
        discovery_failure:
          status: failed
          command_sent: false
          message: Performer discovery failed. No playback command was sent. Do not
            infer that no titles exist.
    - stop: Performer discovery failed.
      response_variable: discovery_failure
  - stop: Performer discovery finished; nothing was played.
    response_variable: discovery_result
resolve_streaming_title:
  alias: Find a subscribed service for a title
  description: >-
    Never call for explicit Kodi/POV requests; use browse_kodi_series for indirect Kodi episodes.
    Read-only PH availability lookup for a named title when the user did NOT specify
    a service. Returns an existing playback tool and arguments; never controls the TV.
    Pass canonical query and preserve year, media_type, from_start, season and episode.
    Only call the returned tool when the user requested playback. Explicit-service
    requests use their existing playback tool directly. Does not search by performer.
    After title/version clarification, preserve original numeric season and episode
    and supply the clarified year. Never ask which service.
  mode: parallel
  max: 3
  fields:
    query:
      name: Title
      required: true
      selector:
        text: null
    year:
      name: Release year
      selector:
        number:
          min: 1800
          max: 2200
          mode: box
    media_type:
      name: Content type
      selector:
        select:
          options: [movie, series]
    from_start:
      name: From the beginning
      default: false
      selector:
        boolean: null
    episode_request:
      name: Natural-language episode description
      description: ONLY for indirect or relative descriptions needing catalog metadata, such as a penultimate season. Never put explicit SxEy or season/episode numbers here; pass numeric season and episode instead and OMIT episode_request, including after title clarification. Kodi fallback returns a metadata step instead of playback.
      selector:
        text: {}
    latest_episode:
      name: Latest aired episode
      description: Preserve an explicit latest-episode request. Supported by Kodi fallback only; do not guess episode numbers.
      selector:
        boolean: {}
    season:
      name: Season
      description: Absolute numeric season from the original request, including SxEy. Preserve after clarification. Never guess a season from a relative position; use episode_request for relative descriptions.
      selector:
        number:
          min: 1
          max: 999
          mode: box
    episode:
      name: Episode
      description: Absolute numeric episode from the original request, including SxEy. Preserve after clarification. Do not guess its season context from an indirect description.
      selector:
        number:
          min: 1
          max: 999
          mode: box
  sequence:
  - variables:
      routing_payload: >-
        {% set ns = namespace(value=dict(query=query, from_start=from_start | default(false, true))) %}
        {% if year is defined and year is not none %}{% set ns.value = dict(ns.value, year=year) %}{% endif %}
        {% if media_type is defined and media_type is not none %}{% set ns.value = dict(ns.value, media_type=media_type) %}{% endif %}
        {% if season is defined and season is not none %}{% set ns.value = dict(ns.value, season=season) %}{% endif %}
        {% if episode is defined and episode is not none %}{% set ns.value = dict(ns.value, episode=episode) %}{% endif %}
        {% if latest_episode is defined and latest_episode is not none %}{% set ns.value = dict(ns.value, latest_episode=latest_episode) %}{% endif %}
        {% if episode_request is defined and episode_request is not none %}{% set ns.value = dict(ns.value, episode_request=episode_request) %}{% endif %}
        {{ ns.value }}
  - action: shell_command.nova_service_routing
    data:
      request_payload: '{{ routing_payload }}'
    response_variable: routing_output
  - variables:
      routing_result: '{{ routing_output.get("stdout", "") | from_json({}) }}'
  - if: >-
      {{ routing_output.get('returncode', 1) != 0 or routing_result is not mapping
         or 'status' not in routing_result }}
    then:
    - variables:
        routing_failure:
          status: failed
          command_sent: false
          message: Service lookup failed. No playback command sent; do not infer unavailability.
    - stop: Service lookup failed.
      response_variable: routing_failure
  - stop: Service lookup finished; nothing was played.
    response_variable: routing_result
