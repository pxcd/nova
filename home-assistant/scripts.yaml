      is boolean or requested_season != requested_season | int or not 1 <= requested_season
      <= 999 or requested_episode is not number or requested_episode is boolean or
      requested_episode != requested_episode | int or not 1 <= requested_episode <=
      999) }}'
    then:
    - variables:
        episode_result:
          status: invalid_episode
          command_sent: false
          message: Supply both season and episode as positive whole numbers. Nothing
            was sent to the TV.
    - stop: Invalid numbered episode.
      response_variable: episode_result
  - if: '{{ numbered_episode and (from_start | default(false) or not start_playback
      | default(true)) }}'
    then:
    - variables:
        episode_result:
          status: unsupported_request
          command_sent: false
          message: Numbered episodes use native playback links only. Start-over is
            a separate command after playing; details-only is unsupported for episode
            playback links. No TV command sent.
    - stop: Unsupported episode options.
      response_variable: episode_result
  - action: rest_command.netflix_title_search
    data:
      query: '{{ query | trim }}'
      series_granularity: '{{ ''episode'' if numbered_episode else ''show'' }}'
    response_variable: search_response
  - if: '{{ search_response.status != 200 or search_response.content is not sequence
      or search_response.content is string or search_response.content is mapping }}'
    then:
    - variables:
        failure_result:
          status: failed
          http_status: '{{ search_response.status }}'
          command_sent: false
          message: Title lookup failed. No TV command was sent. Report failure; never
            claim playback.
    - stop: Title lookup failed.
      response_variable: failure_result
  - variables:
      matches: "{% set wanted = query | lower | regex_replace('[^a-z0-9]', '') %}\
        \ {% set ns = namespace(found=[]) %} {% for item in search_response.content\
        \ %}\n  {% set title = item.get('title', '') | lower | regex_replace('[^a-z0-9]',\
        \ '') %}\n  {% set original = item.get('originalTitle', '') | lower | regex_replace('[^a-z0-9]',\
        \ '') %}\n  {% if wanted and wanted in [title, original] and (year | default(none)\
        \ is none or item.get('releaseYear', item.get('firstAirYear', 0)) | int(0)\
        \ == year | int(0)) %}\n    {% set ns.found = ns.found + [item] %}\n  {% endif\
        \ %}\n{% endfor %} {{ ns.found }}"
  - variables:
      eligible_matches: "{% set ns = namespace(found=[]) %}\n{% for item in matches\
        \ %}\n  {% set available = namespace(value=false) %}\n  {% for option in item.get('streamingOptions',\
        \ {}).get('ph', []) %}\n    {% if option.get('service', {}).get('id') == 'prime'\
        \ and option.get('type') == 'subscription' and option.get('link') %}\n   \
        \   {% set available.value = true %}\n    {% endif %}\n  {% endfor %}\n  {%\
        \ if available.value %}{% set ns.found = ns.found + [item] %}{% endif %}\n\
        {% endfor %}{{ ns.found }}"
  - variables:
      matches: '{{ eligible_matches if eligible_matches | count == 1 else matches
        }}'
  - if: '{{ matches | count != 1 }}'
    then:
    - variables:
        clarification_result:
          status: '{{ ''needs_title_correction'' if matches | count == 0 else ''needs_clarification''
            }}'
          command_sent: false
          message: No unique exact title match. If the transcript has an obvious title
            homophone or speech error, select the clearly intended canonical title
            from these catalog candidates and call this tool once more with that title.
            Ask only when genuinely uncertain. No TV command has been sent.
          candidates: "{% set ns = namespace(items=[]) %}\n{% set candidates = matches\
            \ if matches | count > 0 else search_response.content %}\n{% for item\
            \ in candidates[:12] %}\n {% set available = namespace(value=false) %}\n\
            \ {% for option in item.get('streamingOptions', {}).get('ph', []) %}\n\
            \  {% if option.get('service', {}).get('id') == 'prime' and option.get('type')\
            \ == 'subscription' and option.get('link') %}{% set available.value =\
            \ true %}{% endif %}\n {% endfor %}\n {% if available.value %}\n  {% set\
            \ ns.items = ns.items + [dict(title=item.get('title'), type=item.get('showType'),\
            \ year=item.get('releaseYear', item.get('firstAirYear')), available_on_requested_service=true)]\
            \ %}\n {% endif %}\n{% endfor %}{{ ns.items }}"
          heard_title: '{{ query }}'
    - stop: Title needs clarification.
      response_variable: clarification_result
  - if: '{{ numbered_episode }}'
    then:
    - action: script.play_streaming_episode
      data:
        provider: prime
        select_profile: '{{ select_profile | default(true) }}'
        show: '{{ matches[0] }}'
        season: '{{ requested_season | int }}'
        episode: '{{ requested_episode | int }}'
      response_variable: native_episode_result
    - stop: Numbered episode launch and shared playback handling finished.
      response_variable: native_episode_result
  - variables:
      prime_links: '{% set ns = namespace(links=[]) %}

        {% for option in matches[0].get(''streamingOptions'', {}).get(''ph'', [])
        %}

        {% set link = option.get(''link'', '''') %}

        {% if option.get(''service'', {}).get(''id'') == ''prime'' and option.get(''type'')
        == ''subscription'' and link | regex_match(''^https://(app[.]primevideo[.]com/detail[?]gti=amzn1[.]dv[.]gti[.][a-zA-Z0-9-]+|(www[.])?primevideo[.]com/detail/[a-zA-Z0-9]+/?)$'')
        %}

        {% set ns.links = ns.links + [link] %}

        {% endif %}

        {% endfor %}{{ (ns.links | unique | list)[:1] }}'
  - if: '{{ prime_links | count != 1 }}'
    then:
    - variables:
        unavailable_result:
          status: unavailable
          title: '{{ matches[0].title }}'
          country: PH
          command_sent: false
          message: No supported Prime Video PH subscription link was returned. No
            TV command was sent.
    - stop: Prime Video PH link unavailable.
      response_variable: unavailable_result
  - action: remote.send_command
    target:
      entity_id: remote.sony_xr_55x90l
    data:
      command: HOME
  - delay: 00:00:01
  - action: androidtv.adb_command
    continue_on_error: true
    target:
      entity_id: media_player.android_tv_10_0_0_174
    data:
      command: am start -W -a android.intent.action.VIEW -d '{{ prime_links[0] }}'
        -p com.amazon.amazonvideo.livingroom; echo NOVA_PRIME_{{ context.id }}
  - if: '{{ (''NOVA_PRIME_'' ~ context.id) not in (state_attr(''media_player.android_tv_10_0_0_174'',
      ''adb_response'') | default('''', true)) or ''Status: ok'' not in (state_attr(''media_player.android_tv_10_0_0_174'',
      ''adb_response'') | default('''', true)) }}'
    then:
    - variables:
        launch_failure:
          status: failed
          command_sent: true
          playback_verified: false
          message: Prime Video launch was not confirmed by ADB. No OK was sent; do
            not claim playback.
    - stop: Prime Video intent failed.
      response_variable: launch_failure
  - action: script.streaming_app_profile_and_play
    data:
      provider: prime
      start_playback: '{{ start_playback | default(true) }}'
      from_start: '{{ from_start | default(false) }}'
      select_profile: '{{ select_profile | default(true) }}'
  - variables:
      launch_result:
        status: '{{ (''restart_requested'' if from_start | default(false) else ''playback_requested'')
          if start_playback | default(true) else ''title_link_sent'' }}'
        title: '{{ matches[0].title }}'
        country: PH
        title_link: '{{ prime_links[0] }}'
        command_sent: true
        playback_verified: false
        message: Prime title intent delivered and highlighted profile selected if
          configured. Resume or the circular-arrow Restart icon selected only for
          playback requests. Actual playback/start position is not verified; no ad-skipping
          commands sent.
        year: '{{ matches[0].get(''releaseYear'', matches[0].get(''firstAirYear''))
          }}'
        from_start: '{{ from_start | default(false) and start_playback | default(true)
          }}'
        restart_verified: false
  - stop: Prime Video request sent.
    response_variable: launch_result
launch_prime_video_living_room:
  alias: Open Prime Video on living room TV
  description: Open the installed Prime Video app without selecting content.
  mode: single
  sequence:
  - action: androidtv.adb_command
    target:
      entity_id: media_player.android_tv_10_0_0_174
    data:
      command: am start -W -n com.amazon.amazonvideo.livingroom/com.amazon.ignition.IgnitionActivity
confirm_prime_video_selection:
  alias: Confirm visible Prime Video profile or Play button
  description: Press OK once only when the user confirms their desired Prime profile
    or Play/Resume button is highlighted. Never use to skip ads or blindly recover
    a launch.
  mode: single
  sequence:
  - action: remote.send_command
    target:
      entity_id: remote.sony_xr_55x90l
    data:
      command: DPAD_CENTER
  - variables:
      confirmation:
        status: confirmation_sent
        command_sent: true
        playback_verified: false
        message: One OK sent to the user-confirmed Prime screen; playback is not verified.
  - stop: Prime selection confirmed.
    response_variable: confirmation
netflix_restart_from_playback:
  alias: Netflix automatic restart disabled (internal)
  description: Disabled compatibility helper. Never sends TV commands. Screen/focus
    cannot be reliably detected.
  mode: single
  sequence:
  - variables:
      restart_result:
        status: unsupported_restart
        command_sent: false
        from_start: true
        restart_verified: false
        message: Combined play-and-restart is disabled. Play the title normally first,
          then issue a separate restart-current-Netflix command while it is playing.
          No title was launched and no restart controls were sent.
  - stop: Automatic Netflix restart unavailable.
    response_variable: restart_result
force_quit_tv_app:
  alias: Force quit a TV media app
  description: 'Force-stop one explicitly requested Sony TV media app: Netflix, HBO
    Max, Prime Video, Apple TV, or Kodi. Use only for explicit force quit/force stop/kill
    app requests. Not for restarting a movie/episode from the beginning. App data,
    sign-in and watch history are not cleared. Raw package names and arbitrary shell
    commands are not accepted.'
  mode: single
  fields:
    app:
      name: App
      required: true
      selector:
        select:
          options:
          - Netflix
          - HBO Max
          - Prime Video
          - Apple TV
          - Kodi
  sequence:
  - variables:
      packages:
        netflix: com.netflix.ninja
        hbo max: com.wbd.stream
        prime video: com.amazon.amazonvideo.livingroom
        apple tv: com.apple.atve.sony.appletv
        kodi: org.xbmc.kodi
      package: '{{ packages.get(app | lower | trim, '''') }}'
  - if: '{{ not package }}'
    then:
    - variables:
        quit_result:
          status: unsupported_app
          command_sent: false
          message: Choose Netflix, HBO Max, Prime Video, Apple TV, or Kodi. No command
            was sent.
    - stop: Unsupported app.
      response_variable: quit_result
  - action: androidtv.adb_command
    continue_on_error: true
    target:
      entity_id: media_player.android_tv_10_0_0_174
    data:
      command: am force-stop '{{ package }}' && if pidof '{{ package }}' >/dev/null
        2>&1; then echo NOVA_QUIT_PENDING_{{ context.id }}; else echo NOVA_QUIT_OK_{{
        context.id }}; fi
  - variables:
      stopped: '{{ (''NOVA_QUIT_OK_'' ~ context.id) in (state_attr(''media_player.android_tv_10_0_0_174'',
        ''adb_response'') | default('''', true)) }}'
      quit_result:
        status: '{{ ''force_quit_confirmed'' if stopped else ''failed'' }}'
        app: '{{ app }}'
        command_sent: true
        force_quit_verified: '{{ stopped }}'
        message: '{{ ''Force-stop completed; the app main process is not running.
          App data was not cleared.'' if stopped else ''Force-quit could not be confirmed.
          Do not claim the app was stopped.'' }}'
  - stop: App force-quit result.
    response_variable: quit_result
find_netflix_by_performer:
  alias: Find Netflix movies or specials by performer
  description: Read-only discovery for actor or comedian requests on Netflix in the
    Philippines. Use this before choosing a movie, special, or series by a performer;
    do not guess titles with the playback tool. Checks cast credits and Netflix PH
    subscription links. content_kind=movie excludes likely performer-titled/stand-up
    specials; use special for comedians' stand-up shows. choose_random=true returns
    one selected candidate from the verified pool, but NEVER plays it. Only call a
    playback tool afterward if the user asked to play. Results may be cached and incomplete;
    search_incomplete does not mean no titles are available. Do not invent candidates.
  mode: parallel
  max: 3
  fields:
    performer:
      name: Performer
      description: Canonical full actor or comedian name, not a guessed film title.
      required: true
      selector:
        text: null
    content_kind:
      name: Content kind
      default: movie
      selector:
        select:
          options:
          - movie
          - special
          - series
    choose_random:
      name: Choose a random candidate
      description: Select from the verified pool when the user asks you to pick/play
        one. Does not start playback.
      default: false
      selector:
        boolean: null
  sequence:
  - variables:
      discovery_payload:
        performer: '{{ performer }}'
        content_kind: '{{ content_kind | default("movie") }}'
        choose_random: '{{ choose_random | default(false) }}'
  - action: shell_command.nova_catalog_discovery
    data:
      request_payload: '{{ discovery_payload }}'
    response_variable: discovery_output
  - variables:
      discovery_result: '{{ discovery_output.get("stdout", "") | from_json({}) }}'
  - if: '{{ discovery_output.get("returncode", 1) != 0 or discovery_result is not
      mapping or "status" not in discovery_result }}'
    then:
    - variables:
        discovery_failure:
          status: failed
          command_sent: false
          message: Performer discovery failed. No playback command was sent. Do not
            infer that no titles exist.
    - stop: Performer discovery failed.
      response_variable: discovery_failure
  - stop: Performer discovery finished; nothing was played.
    response_variable: discovery_result
restart_current_netflix:
  alias: Restart the currently playing Netflix video
  description: Instantly restart ONLY the currently playing Netflix movie or current
    episode by an absolute seek to one second. Pass position_seconds=1; no title/query
    arguments. No title lookup, relaunch, Home, Back, directional keys, OK, or rewind
    holds. Netflix must already be foreground and playing. Use as a separate command
    after normal playback, for example restart what is playing on Netflix. This cannot
    choose a title or identify its name. Do not use to restart a different named movie.
    Reports restart_confirmed only when the same Netflix session reports a position
    within three seconds of the beginning. If unavailable or unverified, do not try
    menu navigation or retries.
  mode: single
  sequence:
  - if: '{{ position_seconds is defined and (position_seconds is not number or position_seconds
      is boolean or position_seconds != 1) }}'
    then:
    - variables:
        restart_result:
          status: invalid_position
          command_sent: false
          restart_verified: false
          message: Only the one-second instant-restart target is supported. No seek
            command was sent.
    - stop: Invalid instant restart target.
      response_variable: restart_result
  - if: '{{ state_attr("remote.sony_xr_55x90l", "current_activity") != "com.netflix.ninja"
      }}'
    then:
    - variables:
        restart_result:
          status: needs_netflix_playback
          command_sent: false
          restart_verified: false
          message: Netflix must already be foreground and playing. Nothing was restarted
            or launched.
    - stop: Playing Netflix video required.
      response_variable: restart_result
  - action: androidtv.adb_command
    target:
      entity_id: media_player.android_tv_10_0_0_174
    data:
      command: printf 'NOVA_CURRENT_RESTART_{{ context.id }}\n'; CLASSPATH=/data/local/tmp/nova-seek.jar
        app_process /system/bin NovaSeek seek-one-second
  - variables:
      seek_output: '{{ state_attr("media_player.android_tv_10_0_0_174", "adb_response")
        | default("", true) }}'
  - if: '{{ ("NOVA_CURRENT_RESTART_" ~ context.id) not in seek_output }}'
    then:
    - variables:
        restart_result:
          status: unverified_restart
          command_sent: true
          restart_verified: false
          message: Seek requested but no fresh helper result was received. Do not
            claim success or retry. No UI fallback was sent.
    - stop: Fresh seek result unavailable.
      response_variable: restart_result
  - variables:
      seek_lines: '{{ seek_output | regex_findall("(?m)^NOVA_SEEK_RESULT=(.*)$") }}'
  - variables:
      seek_result: '{{ (seek_lines[0] | from_json({})) if seek_lines | count == 1
        else {} }}'
  - if: '{{ seek_result is not mapping }}'
    then:
    - variables:
        seek_result: {}
  - variables:
      verified: "{{ seek_result.get('status') == 'seek_confirmed'\n   and seek_result.get('package')\
        \ == 'com.netflix.ninja'\n   and seek_result.get('state_before') == 3\n  \
        \ and seek_result.get('target_position_ms') == 1000\n   and seek_result.get('command_sent')\
        \ == true\n   and seek_result.get('seek_verified') == true\n   and seek_result.get('position_after_ms')\
        \ is number\n   and 0 <= seek_result.get('position_after_ms') <= 3000 }}"
  - variables:
      restart_result:
        status: '{{ "restart_confirmed" if verified else ("needs_netflix_playback"
          if seek_result.get("status") == "not_ready" else "unverified_restart") }}'
        command_sent: '{{ seek_result.get("command_sent", true) }}'
        restart_verified: '{{ verified }}'
        playback_verified: '{{ verified and seek_result.get("state_after") == 3 }}'
        target_position_seconds: 1
        position_after_ms: '{{ seek_result.get("position_after_ms") }}'
        message: '{{ "The current Netflix session reports a position within three
          seconds of the beginning after an absolute seek to one second." if verified
          else "Instant restart was not confirmed. Netflix must already be playing
          and the seek helper must be installed. No relaunch or UI fallback was used;
          do not retry automatically." }}'
  - stop: Current Netflix restart finished.
    response_variable: restart_result
  fields:
    position_seconds:
      name: Target position (seconds)
      description: The supported instant-restart target is exactly 1 second. Always
        pass 1; no title arguments.
      required: true
      default: 1
      selector:
        number:
          min: 1
          max: 1
          step: 1
          mode: box

