launch_netflix_living_room:
  alias: Launch Netflix on living room TV
  description: Open Netflix on the Sony XR-55X90L in the Living Room. Wait for the
    TV to report Netflix as the foreground app; an error means launch was not confirmed.
  mode: single
  sequence:
  - action: media_player.play_media
    target:
      entity_id: media_player.bravia_xr_55x90l
    data:
      media_content_type: app
      media_content_id: Netflix
  - wait_template: '{{ state_attr(''remote.sony_xr_55x90l'', ''current_activity'')
      == ''com.netflix.ninja'' }}'
    timeout: 00:00:30
    continue_on_timeout: true
  - if: '{{ not wait.completed }}'
    then:
    - stop: Netflix did not become the active app on the TV.
      error: true
tv_go_home:
  alias: Go to TV home
  description: Return the living room Sony TV to its Google TV home screen. Use for
    requests such as go home, TV home, or exit the current app to the home screen.
  mode: single
  sequence:
  - action: remote.send_command
    target:
      entity_id: remote.sony_xr_55x90l
    data:
      command: HOME
select_netflix_paolo_profile:
  alias: Select Paolo Netflix profile
  description: Press OK on the Netflix profile picker to select Paolo, the only profile.
    Use only when the Netflix profile picker is visible or the user explicitly requests
    profile selection. Does not detect or verify the profile picker; reports only
    that OK was sent.
  mode: single
  sequence:
  - if: '{{ state_attr(''remote.sony_xr_55x90l'', ''current_activity'') not in [''com.netflix.ninja'',
      ''Netflix''] }}'
    then:
    - stop: Netflix is not the active TV app. Open Netflix before selecting the profile.
      error: true
  - action: remote.send_command
    target:
      entity_id: remote.sony_xr_55x90l
    data:
      command: DPAD_CENTER
play_netflix_title:
  alias: Play a show or movie on Netflix
  description: 'Find a named movie or series on Netflix in the Philippines and launch
    its verified subscription link on the Sony. Keep only the canonical title in query;
    pass both season and episode for a specific episode. Always send a fresh command
    for ordinary repeated play requests. Combined play-and-restart is disabled: from_start=true
    returns unsupported_restart without lookup or TV commands. Use the separate restart_current_netflix
    tool only after normal playback has started. Do not work around this with arrows,
    Back, OK, rewind or force quit. Ordinary playback uses the normal link and dedicated
    Play sequence gated by TV connection and app foreground, with fresh media-session readiness/playback checks. No timed OK/profile selection. needs_netflix_ready requires user confirmation of the visible screen; preserve the pending title/episode. Requested title identity remains unverified.'
  mode: single
  fields:
    query:
      name: Title
      description: Canonical movie or show title only. Correct obvious STT homophones
        from context. When a catalog result suggests a clearly intended canonical
        title, retry once using that exact title.
      required: true
      selector:
        text: null
    from_start:
      name: From the beginning
      description: Combined play-and-restart is disabled. True returns unsupported_restart
        without TV commands. Play normally first, then use restart_current_netflix
        as a separate command.
      default: false
      selector:
        boolean: {}
    season:
      name: Season
      description: Explicit season number. Supply both season and episode only when
        the user asks for a specific episode.
      selector:
        number:
          min: 1
          max: 999
          step: 1
          mode: box
    episode:
      name: Episode
      description: Explicit episode number. Supply both season and episode only when
        the user asks for a specific episode.
      selector:
        number:
          min: 1
          max: 999
          step: 1
          mode: box
  sequence:
  - if: '{{ from_start | default(false) }}'
    then:
    - variables:
        restart_result:
          status: unsupported_restart
          command_sent: false
          from_start: true
          restart_verified: false
          message: Combined play-and-restart is disabled. Play the title normally
            first, then issue a separate restart-current-Netflix command while it
            is playing. No title was launched and no restart controls were sent.
    - stop: Automatic Netflix restart unavailable.
      response_variable: restart_result
  - if: '{{ season is defined or episode is defined }}'
    then:
    - if: '{{ season is not defined or episode is not defined }}'
      then:
      - variables:
          episode_result:
            status: needs_episode
            command_sent: false
            message: Provide both the season and episode numbers; no TV command was
              sent.
      - stop: Provide both the season and episode numbers; no TV command was sent.
        response_variable: episode_result
    - if: '{{ season is not number or season is boolean or episode is not number or
        episode is boolean or season | int != season or episode | int != episode or
        season < 1 or episode < 1 or season > 999 or episode > 999 }}'
      then:
      - variables:
          episode_result:
            status: invalid_episode
            command_sent: false
            message: Season and episode must be whole numbers from 1 to 999; no TV
              command was sent.
      - stop: Season and episode must be whole numbers from 1 to 999; no TV command
          was sent.
        response_variable: episode_result
  - action: rest_command.netflix_title_search
    data:
      query: '{{ query | trim }}'
      series_granularity: '{{ ''episode'' if season is defined and episode is defined
        else ''show'' }}'
    response_variable: search_response
  - if: '{{ search_response.status != 200 or search_response.content is not sequence
      or search_response.content is string or search_response.content is mapping }}'
    then:
    - variables:
        failure_result:
          status: failed
          http_status: '{{ search_response.status }}'
          command_sent: false
          message: Title lookup failed. No TV command was sent. Report failure; never
            claim playback.
    - stop: Title lookup failed.
      response_variable: failure_result
  - variables:
      matches: '{% set wanted = query | lower | regex_replace(''[^a-z0-9]'', '''')
        %}

        {% set ns = namespace(found=[]) %}

        {% for item in search_response.content %}

        {% set title = item.get(''title'', '''') | lower | regex_replace(''[^a-z0-9]'',
        '''') %}

        {% set original = item.get(''originalTitle'', '''') | lower | regex_replace(''[^a-z0-9]'',
        '''') %}

        {% if wanted and wanted in [title, original] %}

        {% set selected = namespace(seasons=[]) %}

        {% if season is defined %}

        {% for part in item.get(''seasons'', []) %}

        {% if part.get(''title'', '''') | lower | trim == ''season '' ~ (season |
        int) %}

        {% set entries = namespace(episodes=[]) %}

        {% for entry in part.get(''episodes'', []) %}

        {% set entries.episodes = entries.episodes + [dict(title=entry.get(''title'',
        ''''), streamingOptions=dict(ph=entry.get(''streamingOptions'', {}).get(''ph'',
        [])))] %}

        {% endfor %}

        {% set selected.seasons = selected.seasons + [dict(title=part.get(''title''),
        episodes=entries.episodes)] %}

        {% endif %}{% endfor %}{% endif %}

        {% set ns.found = ns.found + [dict(title=item.get(''title''), showType=item.get(''showType''),
        releaseYear=item.get(''releaseYear''), firstAirYear=item.get(''firstAirYear''),
        streamingOptions=dict(ph=item.get(''streamingOptions'', {}).get(''ph'', [])),
        seasons=selected.seasons)] %}

        {% endif %}{% endfor %}{{ ns.found }}'
  - variables:
      eligible_matches: "{% set ns = namespace(found=[]) %}\n{% for item in matches\
        \ %}\n  {% set available = namespace(value=false) %}\n  {% for option in item.get('streamingOptions',\
        \ {}).get('ph', []) %}\n    {% if option.get('service', {}).get('id') == 'netflix'\
        \ and option.get('type') == 'subscription' and option.get('link') %}\n   \
        \   {% set available.value = true %}\n    {% endif %}\n  {% endfor %}\n  {%\
        \ if available.value %}{% set ns.found = ns.found + [item] %}{% endif %}\n\
        {% endfor %}{{ ns.found }}"
  - variables:
      matches: '{{ eligible_matches if eligible_matches | count == 1 else matches
        }}'
  - if: '{{ matches | count != 1 }}'
    then:
    - variables:
        clarification_result:
          status: '{{ ''needs_title_correction'' if matches | count == 0 else ''needs_clarification''
            }}'
          command_sent: false
          message: No unique exact title match. If the transcript has an obvious title
            homophone or speech error, select the clearly intended canonical title
            from these catalog candidates and call this tool once more with that title.
            Ask only when genuinely uncertain. No TV command has been sent.
          candidates: "{% set ns = namespace(items=[]) %}\n{% set candidates = matches\
            \ if matches | count > 0 else search_response.content %}\n{% for item\
            \ in candidates[:12] %}\n {% set available = namespace(value=false) %}\n\
            \ {% for option in item.get('streamingOptions', {}).get('ph', []) %}\n\
            \  {% if option.get('service', {}).get('id') == 'netflix' and option.get('type')\
            \ == 'subscription' and option.get('link') %}{% set available.value =\
            \ true %}{% endif %}\n {% endfor %}\n {% if available.value %}\n  {% set\
            \ ns.items = ns.items + [dict(title=item.get('title'), type=item.get('showType'),\
            \ year=item.get('releaseYear', item.get('firstAirYear')), available_on_requested_service=true)]\
            \ %}\n {% endif %}\n{% endfor %}{{ ns.items }}"
          heard_title: '{{ query }}'
    - stop: Title needs clarification.
      response_variable: clarification_result
  - variables:
      selected_item: '{{ matches[0] }}'
  - if: '{{ season is defined and episode is defined }}'
    then:
    - if: '{{ matches[0].get(''showType'') != ''series'' }}'
      then:
      - variables:
          episode_result:
            status: invalid_episode
            command_sent: false
            message: The matched title is a movie, not a series; no TV command was
              sent.
      - stop: The matched title is a movie, not a series; no TV command was sent.
        response_variable: episode_result
    - variables:
        season_matches: '{% set ns = namespace(found=[]) %}{% for item in matches[0].get(''seasons'',
          []) %}{% if item.get(''title'', '''') | lower | trim == ''season '' ~ (season
          | int) %}{% set ns.found = ns.found + [item] %}{% endif %}{% endfor %}{{
          ns.found }}'
    - if: '{{ season_matches | count != 1 }}'
      then:
      - variables:
          episode_result:
            status: unavailable
            command_sent: false
            message: The requested numbered season was not uniquely present in the
              catalog. No TV command was sent; do not substitute a different season
              or resume the series.
      - stop: The requested numbered season was not uniquely present in the catalog.
          No TV command was sent; do not substitute a different season or resume the
          series.
        response_variable: episode_result
    - variables:
        episode_items: '{{ season_matches[0].get(''episodes'', []) }}'
    - if: '{{ episode | int > episode_items | count }}'
      then:
      - variables:
          episode_result:
            status: unavailable
            command_sent: false
            message: The requested episode was not present in the catalog. No TV command
              was sent; do not substitute another episode or resume the series.
      - stop: The requested episode was not present in the catalog. No TV command
          was sent; do not substitute another episode or resume the series.
        response_variable: episode_result
    - variables:
        selected_item: '{{ episode_items[(episode | int) - 1] }}'
  - variables:
      netflix_ids: '{% set ns = namespace(ids=[]) %}

        {% for option in selected_item.get(''streamingOptions'', {}).get(''ph'', [])
        %}

        {% if option.get(''service'', {}).get(''id'') == ''netflix'' and option.get(''type'')
        == ''subscription'' %}

        {% set ids = option.get(''videoLink'', option.get(''link'', '''')) | regex_findall(''^https://www[.]netflix[.]com/(?:title|watch)/([0-9]{6,10})/?$'')
        %}

        {% set ns.ids = ns.ids + ids %}

        {% endif %}{% endfor %}{{ ns.ids | unique | list }}'
  - if: '{{ netflix_ids | count != 1 }}'
    then:
    - variables:
        unavailable_result:
          status: unavailable
          title: '{{ matches[0].title }}'
          country: PH
          command_sent: false
          message: No unique Netflix PH subscription link was returned. Nothing was
            sent to the TV; do not claim playback.
    - stop: Netflix PH link unavailable.
      response_variable: unavailable_result
  - if: '{{ not is_state("remote.sony_xr_55x90l", "on") or states("media_player.sony_xr_55x90l_2") in ["off", "unknown", "unavailable"] or is_state("media_player.bravia_xr_55x90l", "off") }}'
    then:
    - action: media_player.turn_on
      continue_on_error: true
      target:
        entity_id: media_player.bravia_xr_55x90l
  - wait_template: '{{ is_state("remote.sony_xr_55x90l", "on") and states("media_player.sony_xr_55x90l_2") not in ["off", "unknown", "unavailable"] }}'
    timeout: '00:00:30'
    continue_on_timeout: true
  - if: '{{ not wait.completed }}'
    then:
    - variables:
        launch_result:
          status: needs_tv_ready
          command_sent: true
          playback_verified: false
          message: TV wake/remote connection was not confirmed within 30 seconds. No title or Play command sent. Check that the TV and network are available.
    - stop: TV not ready.
      response_variable: launch_result
  - action: remote.send_command
    target:
      entity_id: remote.sony_xr_55x90l
    data:
      command: HOME
  - wait_template: '{{ is_state("remote.sony_xr_55x90l", "on") and state_attr("remote.sony_xr_55x90l", "current_activity") not in [none, "", "com.netflix.ninja"] }}'
    timeout: '00:00:05'
    continue_on_timeout: true
  - if: '{{ not wait.completed }}'
    then:
    - variables:
        launch_result:
          status: needs_tv_ready
          command_sent: true
          playback_verified: false
          message: Home transition was not confirmed. No title or Play command sent; no timed navigation fallback.
    - stop: Home transition unconfirmed.
      response_variable: launch_result
  - action: media_player.play_media
    target:
      entity_id: media_player.sony_xr_55x90l_2
    data:
      media_content_type: url
      media_content_id: https://www.netflix.com/{{ 'watch' if (season is defined and episode is defined) or matches[0].get('showType') == 'movie' else 'title' }}/{{ netflix_ids[0] }}?source=30
  - wait_template: '{{ is_state("remote.sony_xr_55x90l", "on") and state_attr("remote.sony_xr_55x90l", "current_activity") == "com.netflix.ninja" }}'
    timeout: '00:00:20'
    continue_on_timeout: true
  - if: '{{ not wait.completed }}'
    then:
    - variables:
        launch_result:
          status: needs_netflix_foreground
          title: '{{ matches[0].title }}'
          command_sent: true
          play_command_sent: false
          playback_verified: false
          message: Title link sent, but Netflix foreground was not confirmed. No Play or selection keys sent.
    - stop: Netflix foreground unconfirmed.
      response_variable: launch_result
  - action: script.netflix_readiness_probe
    data:
      wait_seconds: 10
    response_variable: readiness
  - variables:
      play_sent: false
      previous_position: null
      playback_stable: false
      resume_retry_sent: false
  - if: '{{ is_state("remote.sony_xr_55x90l", "on") and state_attr("remote.sony_xr_55x90l", "current_activity") == "com.netflix.ninja" }}'
    then:
    - action: media_player.media_play
      target:
        entity_id: media_player.sony_xr_55x90l_2
    - variables:
        play_sent: true
    - repeat:
        sequence:
        - action: script.netflix_readiness_probe
          data:
            wait_seconds: 0
          response_variable: readiness
        - variables:
            playback_stable: '{{ readiness.get("playing", false) and previous_position is number and readiness.get("position_ms") is number and readiness.position_ms >= previous_position + 500 }}'
        - variables:
            previous_position: '{{ readiness.get("position_ms") if readiness.get("playing", false) else none }}'
        - if: '{{ readiness.get("ready", false) and not readiness.get("playing", false) and not resume_retry_sent }}'
          then:
          - action: media_player.media_play
            target:
              entity_id: media_player.sony_xr_55x90l_2
          - variables:
              resume_retry_sent: true
        - if: '{{ not playback_stable and repeat.index < 5 }}'
          then:
          - delay: '00:00:01'
        until: '{{ playback_stable or repeat.index >= 5 }}'
  - variables:
      launch_result:
        status: '{{ "playback_reported" if playback_stable else "needs_netflix_ready" }}'
        title: '{{ matches[0].title }}'
        country: PH
        netflix_id: '{{ netflix_ids[0] }}'
        command_sent: true
        play_command_sent: '{{ play_sent }}'
        playback_verified: false
        playback_advancing: '{{ playback_stable }}'
        resume_retry_sent: '{{ resume_retry_sent }}'
        media_session_playing: '{{ readiness.get("playing", false) }}'
        title_verified: false
        season: '{{ season | int if season is defined else none }}'
        episode: '{{ episode | int if episode is defined else none }}'
        episode_title: '{{ selected_item.get("title") if season is defined and episode is defined else none }}'
        message: >-
          {{ "Netflix reports a playing media session advancing across consecutive fresh checks. The requested title/episode is not independently verified."
          if playback_stable else
          "Netflix is foreground but playback readiness is not confirmed. It may still be loading or waiting for profile selection; the screen cannot be identified. No OK or movement keys were sent. Ask the user what is visible. If the user confirms the profile picker, select Paolo only on their instruction, then rerun this same title/episode request. Preserve the pending title and episode; do not switch service or claim playback." }}
  - stop: Netflix readiness check finished.
    response_variable: launch_result
play_hbo_title:
  alias: Play or open a title on HBO Max
  description: 'Find a named title included with HBO Max in PH. query is the canonical
    title. start_playback=true for play/watch/resume, false for details only. from_start=true
    selects Restart instead of Resume for the selected movie or current episode. The
    Sony HBO app is closed and relaunched to establish its profile-picker state; the
    previously confirmed highlighted profile is selected before title controls. Actual
    playback position is not verified. Catalog: Streaming Availability API by Movie
    of the Night. Explicit season+episode selects the episode by an app-native deep link,
    then reuses the ordinary profile and Play controls. No season/episode menu navigation. Both numbers are required.
    Numbered episodes cannot combine from_start or details-only requests.'
  mode: single
  fields:
    query:
      name: Title
      description: Canonical movie or show title only. Correct obvious STT homophones
        from context. When a catalog result suggests a clearly intended canonical
        title, retry once using that exact title.
      required: true
      selector:
        text: null
    start_playback:
      name: Start playback
      description: True for play/watch/resume; false for opening title details only.
      default: true
      selector:
        boolean: {}
    from_start:
      name: From the beginning
      description: True only for from the start/beginning/start over. Selects Restart
        for the current movie or selected episode; never starts a series at episode
        one.
      default: false
      selector:
        boolean: {}
    season:
      name: Season
      description: Explicit positive integer; supply both season and episode for native
        episode launch. No movement-key episode selection.
      selector:
        number:
          min: 1
          max: 999
          step: 1
          mode: box
    episode:
      name: Episode
      description: Explicit positive integer; supply both season and episode for native
        episode launch. No movement-key episode selection.
      selector:
        number:
          min: 1
          max: 999
          step: 1
          mode: box
  sequence:
  - variables:
      requested_season: '{{ season | default(none) }}'
      requested_episode: '{{ episode | default(none) }}'
  - variables:
      numbered_episode: '{{ requested_season is not none or requested_episode is not
        none }}'
  - if: '{{ numbered_episode and (requested_season is not number or requested_season
      is boolean or requested_season != requested_season | int or not 1 <= requested_season
      <= 999 or requested_episode is not number or requested_episode is boolean or
      requested_episode != requested_episode | int or not 1 <= requested_episode <=
      999) }}'
    then:
    - variables:
        episode_result:
          status: invalid_episode
          command_sent: false
          message: Supply both season and episode as positive whole numbers. Nothing
            was sent to the TV.
    - stop: Invalid numbered episode.
      response_variable: episode_result
  - if: '{{ numbered_episode and (from_start | default(false) or not start_playback
      | default(true)) }}'
    then:
    - variables:
        episode_result:
          status: unsupported_request
          command_sent: false
          message: Numbered episodes use native playback links only. Start-over is
            a separate command after playing; details-only is unsupported for episode
            playback links. No TV command sent.
    - stop: Unsupported episode options.
      response_variable: episode_result
  - action: rest_command.netflix_title_search
    data:
      query: '{{ query | trim }}'
      series_granularity: '{{ ''episode'' if numbered_episode else ''show'' }}'
    response_variable: search_response
  - if: '{{ search_response.status != 200 or search_response.content is not sequence
      or search_response.content is string or search_response.content is mapping }}'
    then:
    - variables:
        failure_result:
          status: failed
          http_status: '{{ search_response.status }}'
          command_sent: false
          message: Title lookup failed. No TV command was sent. Report failure; never
            claim playback.
    - stop: Title lookup failed.
      response_variable: failure_result
  - variables:
      matches: "{% set wanted = query | lower | regex_replace('[^a-z0-9]', '') %}\
        \ {% set ns = namespace(found=[]) %} {% for item in search_response.content\
        \ %}\n  {% set title = item.get('title', '') | lower | regex_replace('[^a-z0-9]',\
        \ '') %}\n  {% set original = item.get('originalTitle', '') | lower | regex_replace('[^a-z0-9]',\
        \ '') %}\n  {% if wanted and wanted in [title, original] %}\n    {% set ns.found\
        \ = ns.found + [item] %}\n  {% endif %}\n{% endfor %} {{ ns.found }}"
  - variables:
      eligible_matches: "{% set ns = namespace(found=[]) %}\n{% for item in matches\
        \ %}\n  {% set available = namespace(value=false) %}\n  {% for option in item.get('streamingOptions',\
        \ {}).get('ph', []) %}\n    {% if option.get('service', {}).get('id') == 'hbo'\
        \ and option.get('type') == 'subscription' and option.get('link') %}\n   \
        \   {% set available.value = true %}\n    {% endif %}\n  {% endfor %}\n  {%\
        \ if available.value %}{% set ns.found = ns.found + [item] %}{% endif %}\n\
        {% endfor %}{{ ns.found }}"
  - variables:
      matches: '{{ eligible_matches if eligible_matches | count == 1 else matches
        }}'
  - if: '{{ matches | count != 1 }}'
    then:
    - variables:
        clarification_result:
          status: '{{ ''needs_title_correction'' if matches | count == 0 else ''needs_clarification''
            }}'
          command_sent: false
          message: No unique exact title match. If the transcript has an obvious title
            homophone or speech error, select the clearly intended canonical title
            from these catalog candidates and call this tool once more with that title.
            Ask only when genuinely uncertain. No TV command has been sent.
          candidates: "{% set ns = namespace(items=[]) %}\n{% set candidates = matches\
            \ if matches | count > 0 else search_response.content %}\n{% for item\
            \ in candidates[:12] %}\n {% set available = namespace(value=false) %}\n\
            \ {% for option in item.get('streamingOptions', {}).get('ph', []) %}\n\
            \  {% if option.get('service', {}).get('id') == 'hbo' and option.get('type')\
            \ == 'subscription' and option.get('link') %}{% set available.value =\
            \ true %}{% endif %}\n {% endfor %}\n {% if available.value %}\n  {% set\
            \ ns.items = ns.items + [dict(title=item.get('title'), type=item.get('showType'),\
            \ year=item.get('releaseYear', item.get('firstAirYear')), available_on_requested_service=true)]\
            \ %}\n {% endif %}\n{% endfor %}{{ ns.items }}"
          heard_title: '{{ query }}'
    - stop: Title needs clarification.
      response_variable: clarification_result
  - if: '{{ numbered_episode }}'
    then:
    - action: script.play_streaming_episode
      data:
        provider: hbo
        show: '{{ matches[0] }}'
        season: '{{ requested_season | int }}'
        episode: '{{ requested_episode | int }}'
      response_variable: native_episode_result
    - stop: Numbered episode launch and shared playback handling finished.
      response_variable: native_episode_result
  - variables:
      hbo_links: '{% set ns = namespace(links=[]) %}

        {% for option in matches[0].get(''streamingOptions'', {}).get(''ph'', [])
        %}

        {% set link = option.get(''link'', '''') %}

        {% if option.get(''service'', {}).get(''id'') == ''hbo'' and option.get(''type'')
        == ''subscription'' and link | regex_match(''^https://play[.]hbomax[.]com/(show|movie)/[a-zA-Z0-9-]+/?$'')
        %}

        {% set ns.links = ns.links + [link] %}

        {% endif %}

        {% endfor %}{{ ns.links | unique | list }}'
  - if: '{{ hbo_links | count != 1 }}'
    then:
    - variables:
        unavailable_result:
          status: unavailable
          title: '{{ matches[0].title }}'
          country: PH
          command_sent: false
